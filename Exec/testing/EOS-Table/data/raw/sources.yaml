  - id: ifpeos
    citation: >
      D. I. Mihaylov, V. V. Karasiev, S. X. Hu, J. R. Rygg, V. N. Goncharov,
      G. W. Collins, "Improved first-principles equation-of-state table of
      deuterium for high-energy-density applications", Phys. Rev. B 104
      (2021) 144104 (iFPEOS; T-SCAN-L thermal XC + PIMD nuclear quantum
      effects). DOI 10.1103/PhysRevB.104.144104. See
      doc/eos_splice_plan.md section 1.
    url: https://par.nsf.gov/servlets/purl/10355657
    retrieved: 2026-07-11
    license: >
      APS-published, DOE-funded accepted manuscript (open access via
      NSF-PAR/OSTI); cite the article.
    acquisition: manual
    notes: >
      53 rho points 0.001..1596.49 g/cc x 39 T points 800 K..256 MK.
      Article PDF downloaded manually 2026-07-11; characterisation memo:
      iFPEOS/README.md. 2026-07-12: the APS Supplemental Material was
      confirmed (user download) to contain ONLY the rho = 0.001 g/cc
      demonstration isochore — the full table is NOT published. iFPEOS is
      therefore DEMOTED from seam-1 source to validation data (the one
      isochore + paper figures); H-REOS.3 (entry 'reos3') takes the WDM
      role. Optional upgrade path: request the full table from the LLE
      authors (Mihaylov/Karasiev/Hu).
    files:
      - path: iFPEOS/iFPEOS_Deuterium_PhysRevB.104.144104.pdf
        sha256: cfed3dcfed29a5ae5d516e9b38268e771210bcde5b373a8f8a166edd36362090
      - path: iFPEOS/SM/Supplmental_Material_iFPEOS.pdf
