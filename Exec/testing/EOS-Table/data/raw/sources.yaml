    url: https://www.osti.gov/pages/servlets/purl/1342023
    retrieved: 2026-07-11
    license: LLNL/DOE report, publicly released via OSTI PAGES.
    acquisition: scripted
    notes: >
      T=0 K hydrogen isotherm V(P), 0..100 GPa in 1 GPa steps — the cold
      curve for the semi-analytic D2 model (llnl_coldcurve/
      extract_h_coldcurve.py is the re-runnable transcription; monotonicity
      and column-count invariants asserted; H-vs-D zero-point caveat in the
      CSV header). Supersedes the earlier 'dac-loubeyre' plan entry: same
      underlying DAC data, already reduced to 0 K, which is what the QEOS
      free-energy decomposition wants.
    files:
