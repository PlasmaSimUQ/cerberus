        # confirmed (2026-07-12) to be the complete published SM.
      - path: iFPEOS/ifpeos_rho0.001_isochore.csv
        sha256: 672373a70b53b1737bf666ad8f09b0a5e278bc107a2567141ae40dfe5099a1cc
        # transcribed by iFPEOS/extract_sm_isochore.py (re-runnable;
