# Raw EOS building-block manifest (doc/eos_creation_plan.md, Part 2).
#
# Every raw dataset the offline toolchain consumes is recorded here:
# citation, origin, retrieval date, sha256 per file, license note and
# acquisition mode. Verify/fetch with:
#
#     python3 Exec/python_analysis/eos_table_prep.py sources --verify
#     python3 Exec/python_analysis/eos_table_prep.py sources --fetch
#
# acquisition: scripted  = fetchable by URL (checksum-gated)
#              manual    = requires a human step (licensed/paywalled/forms)
#              digitized = transcribed from a paper table/figure; the
#                          transcription script or provenance columns are
#                          committed next to the data
#
# File paths are relative to this directory. Prose characterisation of each
# source lives in README.md; this file is the machine-checkable record.

sources:
  - id: fpeos
    citation: >
      B. Militzer, F. Gonzalez-Cataldo, S. Zhang, K. P. Driver, F. Soubiran,
      "First-Principles Equation of State Database for Warm Dense Matter
      Computation", Phys. Rev. E 103 (2021) 013203.
    url: https://militzer.berkeley.edu/FPEOS/fpeos_10-26-25.tar.gz
    retrieved: 2026-07-07
    license: >
      No explicit license file; the authors request citation of the articles
      listed in each table's header (see README.md).
    acquisition: scripted
    notes: >
      H table (FPEOS/H_EOS_09-18-20.txt inside the archive) is the WDM/plasma
      deuterium building block via isotope mass-scaling; archive kept
      byte-identical to the download, extraction happens in scratch space.
    files:
      - path: fpeos_10-26-25.tar.gz
        sha256: b42c44298e8630afe73e30db4755bd9a4b8a2f41ad147a82130accd3476a1ab1

  - id: hugoniot-mc2000
    citation: >
      B. Militzer, D. M. Ceperley, "Path Integral Monte Carlo Calculation of
      the Deuterium Hugoniot", Phys. Rev. Lett. 85 (2000) 1890
      (arXiv:physics/0001047).
    url: https://arxiv.org/abs/physics/0001047
    retrieved: 2026-07-07
    license: arXiv non-exclusive distribution; data quoted for comparison.
    acquisition: digitized
    notes: >
      Table transcribed 2026-07-07 from the ar5iv HTML rendering; columns
      T rho P_GPa compression, initial state in the file header. Used as the
      Stage-4 'anchor-PIMC' gate reference (EOS-Hugoniot/check.py).
    files:
      - path: hugoniot_MC2000_PRL85_1890.txt
        sha256: 6b8f517fa8bd503b0ced6038a25b6a51bd75bca768901719e8f9196bc71af4de

