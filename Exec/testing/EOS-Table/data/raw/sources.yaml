        sha256: 723ec1efa63e5bc1a019712700d442ab4373c5cbea4cbf32924f0d308fee08a5
      - path: reos3/table2_HREOS3.dat
        sha256: e93ae1223479b7c79c79198cae46751bfee92701b2c51bdfbc8104fcb428369b

  - id: dft-wide-h
