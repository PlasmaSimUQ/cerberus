  - id: reos3
    citation: >
      A. Becker, W. Lorenzen, J. J. Fortney, N. Nettelmann, M. Schoettler,
      R. Redmer, "Ab initio equations of state for hydrogen (H-REOS.3) and
      helium (He-REOS.3) and their implications for the interior of brown
      dwarfs", Astrophys. J. Suppl. Ser. 215, 21 (2014). Machine-readable
      table 2 via VizieR catalog J/ApJS/215/21 (CDS).
    url: https://cdsarc.cds.unistra.fr/ftp/J/ApJS/215/21/table2.dat
    retrieved: 2026-07-12
    license: CDS/VizieR — free for research with citation of the article.
    acquisition: scripted
    notes: >
      H-REOS.3: FT-DFT-MD + FVT wide-range hydrogen EOS, 60 K..1e7 K,
      3e-8..1800 g/cc, 106 rho x 42 T (~rectangular, 105 per isotherm),
      columns rho[g/cc] T[K] P[GPa] u[kJ/g], no P<=0 rows. PROMOTED to the
      seam-1/WDM building block (2026-07-12) after the iFPEOS table proved
      unpublished; mass-scale H->D like FPEOS. Caveats vs iFPEOS: classical
      ions (no NQE), PBE-class XC. iFPEOS materials remain as validation.
    files:
